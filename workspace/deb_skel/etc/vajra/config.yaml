# Generic settings
generic_settings:
  operation_mode: "monitor"
  work_directory: "/tmp/vajra"
  db_directory: "./database"
  db_filename: "vajra.db"

api_settings:
  host: "localhost"
  port: 8086

timing_settings:
  autorun_scan_time_min: 30
  database_cleanup_time_hour: 24
  database_retention_days: 90
  shutdown_timeout_sec: 30
  single_file_scan_timeout_sec: 60

performance_settings:
  default_threads: 2
  max_allowed_threads: 3
  scan_queue_size: 1000
  file_scan_buffer_size: 100

scan_settings:
  target_directory: "/home/lakshy/Citadel/Filling Cabinet/"
  rules_filepath: "../rules.zip"
  exclusion_rules:
    exclude_paths:
    exclude_extensions:
      - swp
      - lock
      - pid
      - socket
    exclude_patterns:
    exclude_processes:
      - gopls
      - pylsp
      - rust-analyzer
      - typescript-language-server
      - clangd
      - code
      - systemd
      - dbus-daemon
      - pulseaudio

logging:
  enable_console: true
  use_json: true
  enable_file_logging: true
  log_directory: "./logs"
  log_filename: "vajra.log"
  max_size_mb: 50
  max_age_days: 1
  max_backups: 5
  log_level: "info"
  time_format: "UNIXMS"
